name: Code Quality & Database Syntax Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate_codebase:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: faa_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint QGIS Python Script (Syntax & PEP 8 Checking)
      run: |
        # Check python directory if it exists, otherwise skip to prevent empty failures
        if [ -d python ]; then
          flake8 python/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 python/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        else
          echo "Python folder not found yet. Skipping lint check."
        fi

    - name: Install Client Database Validation Tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Validate SQL Database Schemas and Extensions
      env:
        PGPASSWORD: ci_test_password
      run: |
        pg_isready -h localhost -p 5432 -U postgres
        
        if [ -f sql/dc_region_aviation_postgis.sql ]; then
          echo "Validating baseline script execution..."
          psql -h localhost -p 5432 -U postgres -d faa_db -f sql/dc_region_aviation_postgis.sql
        else
          echo "Base dataset script not detected. Skipping step."
        fi

        if [ -d sql ] && [ "$(ls -A sql)" ]; then
          echo "Validating available PostGIS database scripts..."
          for f in sql/*.sql; do
            if [ "$f" != "sql/dc_region_aviation_postgis.sql" ]; then
              echo "Testing execution of $f..."
              psql -h localhost -p 5432 -U postgres -d faa_db -f "$f"
            fi
          done
        else
          echo "No custom analytic SQL files found yet. Skipping verification."
        fi

