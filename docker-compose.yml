# Local PostGIS database. On first start it runs sql/01_*.sql then sql/02_*.sql
# (files in /docker-entrypoint-initdb.d run in name order; the tests/ subfolder is ignored).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: faa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
